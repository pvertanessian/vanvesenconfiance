<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Vanves en Confiance – Liens utiles</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #005ca9;
      --coral: #f26150;
      --bg: #f5f7fb;
      --text: #133047;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 1.5rem;
      max-width: 720px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header-logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 0.75rem;
    }

    .header-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 1.5rem;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: linear-gradient(135deg, var(--blue), var(--coral));
      border-radius: 0.9rem;
      padding: 0.09rem;
    }

    .card-inner {
      background: white;
      border-radius: 0.8rem;
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
    }

    .card-title {
      font-weight: 700;
      margin-bottom: 0.75rem;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue);
    }

    .card-img {
      max-width: 200px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Séparateur graphique */
    .separator {
      margin: 1.8rem auto 0.8rem auto;
      width: 60%;
      height: 2px;
      background: var(--blue);
      border-radius: 2px;
    }

    /* Petit texte explicatif, maintenant en bleu */
    .mid-note {
      margin-top: 0.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--blue);
      line-height: 1.4;
    }

    /* Animation footer */
    @keyframes vecFadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      40% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0.9; }
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      color: var(--coral);
      letter-spacing: 0.5px;
      animation: vecFadeUp 3.5s ease-in-out forwards;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">

      <div class="header">
        <a href="https://www.vanvesenconfiance.fr" target="_blank" rel="noopener">
          <img src="logo.jpg" alt="Vanves en Confiance" class="header-logo">
        </a>
        <div class="header-title">Vanves en Confiance – Liens directs</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-inner">
            <a class="card-link"
               href="https://docs.google.com/forms/d/e/1FAIpQLSc_453I5A4MBeNL4AUFqYbIhaVYJcc274kJT_peKcuPZkVWow/viewform"
               target="_blank">
              <div class="card-title">Enquête</div>
              <img src="qrcode1.jpg" class="card-img" alt="QR Enquête">
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-inner">
            <a class="card-link"
               href="https://docs.google.com/forms/d/e/1FAIpQLSdRpx2SGyhcIbXq6uTP8jHnGZXQL6Ia_RiwrtIYpZOS3CWzaQ/viewform"
               target="_blank">
              <div class="card-title">Comité de soutien</div>
              <img src="qrcode2.png" class="card-img" alt="QR Comité">
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-inner">
            <a class="card-link"
               href="https://www.instagram.com/vanvesenconfiance"
               target="_blank">
              <div class="card-title">Instagram</div>
              <img src="IN.png" class="card-img" alt="QR Instagram">
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-inner">
            <a class="card-link"
               href="https://www.facebook.com/vanvesconfiance2026"
               target="_blank">
              <div class="card-title">Facebook</div>
              <img src="FB.png" class="card-img" alt="QR Facebook">
            </a>
          </div>
        </div>
      </div>

      <!-- SÉPARATEUR + TEXTE -->
      <div class="separator"></div>

      <div class="mid-note">
        Scannez ou cliquez sur les QR codes pour accéder au comité de soutien et à nos réseaux sociaux — et invitez vos contacts à nous rejoindre.
      </div>

      <!-- FOOTER -->
      <div class="footer">
        A Vanves, la confiance ça se prouve !
      </div>

    </div>
  </div>
</body>
</html>
