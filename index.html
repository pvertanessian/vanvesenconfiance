<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Vanves en Confiance – Liens utiles</title>

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />

  <!-- Police façon Vanves en Confiance -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #005ca9;
      --coral: #f26150;
      --bg: #f5f7fb;
      --text: #133047;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 1.5rem;
      max-width: 720px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header-logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 0.75rem auto;
    }

    .header-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(135deg, var(--blue), var(--coral));
      border-radius: 0.9rem;
      padding: 0.09rem; /* fine border effect */
    }

    .card-inner {
      background: #ffffff;
      border-radius: 0.8rem;
      padding: 1rem;
      text-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-link {
      color: inherit;
      text-decoration: none;
      display: block;
    }

    .card-title {
      font-weight: 700;
      margin-bottom: 0.75rem;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--blue);
    }

    .card-img {
      max-width: 200px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .card-caption {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #888;
    }

    /* Animation footer */
    @keyframes vecFadeUp {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      40% {
        opacity: 1;
        transform: translateY(0);
      }
      80% {
        opacity: 1;
      }
      100% {
        opacity: 0.9;
      }
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      color: var(--coral);
      letter-spacing: 0.5px;
      animation: vecFadeUp 3.5s ease-in-out forwards;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="container">

      <div class="header">
        <!-- LOGO CLIQUABLE -->
        <a href="https://www.vanvesenconfiance.fr" target="_blank" rel="noopener">
          <img src="logo.jpg"
               alt="Vanves en Confiance avec Bernard Gauducheau"
               class="header-logo" />
        </a>

        <div class="header-title">Liens directs</div>
      </div>

      <div class="grid">
        <!-- ENQUÊTE -->
        <div class="card">
          <div class="card-inner">
            <a
              class="card-link"
              href="https://docs.google.com/forms/d/e/1FAIpQLSc_453I5A4MBeNL4AUFqYbIhaVYJcc274kJT_peKcuPZkVWow/viewform"
              target="_blank"
              rel="noopener"
            >
              <div class="card-title">Enquête</div>
              <img
                src="qrcode1.jpg"
                alt="QR code – Enquête Vanves en Confiance"
                class="card-img"
              />
        </div>

        <!-- COMITÉ DE SOUTIEN -->
        <div class="card">
          <div class="card-inner">
            <a
              class="card-link"
              href="https://docs.google.com/forms/d/e/1FAIpQLSdRpx2SGyhcIbXq6uTP8jHnGZXQL6Ia_RiwrtIYpZOS3CWzaQ/viewform"
              target="_blank"
              rel="noopener"
            >
              <div class="card-title">Comité de soutien</div>
              <img
                src="qrcode2.png"
                alt="QR code – Comité de soutien"
                class="card-img"
              />
        </div>

        <!-- INSTAGRAM -->
        <div class="card">
          <div class="card-inner">
            <a
              class="card-link"
              href="https://www.instagram.com/vanvesenconfiance"
              target="_blank"
              rel="noopener"
            >
              <div class="card-title">Instagram</div>
              <img
                src="IN.png"
                alt="QR code – Instagram Vanves en Confiance"
                class="card-img"
              />
        </div>

        <!-- FACEBOOK -->
        <div class="card">
          <div class="card-inner">
            <a
              class="card-link"
              href="https://www.facebook.com/vanvesconfiance2026"
              target="_blank"
              rel="noopener"
            >
              <div class="card-title">Facebook</div>
              <img
                src="FB.png"
                alt="QR code – Facebook Vanves en Confiance"
                class="card-img"
              />
            
        </div>
      </div>

      <!-- FOOTER ANIMÉ -->
      <div class="footer">
        A Vanves, la confiance ça se prouve !
      </div>

    </div>
  </div>
</body>
</html>
